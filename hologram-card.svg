<svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#0a0e1a"/>
    <stop offset="100%" stop-color="#0d1421"/>
  </linearGradient>
  <linearGradient id="border" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#22d3ee"/>
    <stop offset="50%" stop-color="#818cf8"/>
    <stop offset="100%" stop-color="#22d3ee"/>
  </linearGradient>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="3" result="blur"/>
    <feMerge>
      <feMergeNode in="blur"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>
  <style>
    .ascii { font-family: 'Courier New', monospace; font-size: 9px; fill: #5eead4; }
    .title { font-family: 'Courier New', monospace; font-size: 15px; fill: #67e8f9; font-weight: bold; letter-spacing: 1px; }
    .panel-label { font-family: 'Courier New', monospace; font-size: 11px; fill: #64748b; letter-spacing: 3px; }
    .label { font-family: 'Courier New', monospace; font-size: 14px; font-weight: bold; }
    .val { font-family: 'Courier New', monospace; font-size: 14px; fill: #e2e8f0; }
    .dim { font-family: 'Courier New', monospace; font-size: 14px; fill: #475569; }
    .dots { font-family: 'Courier New', monospace; font-size: 14px; fill: #334155; }
    .section { font-family: 'Courier New', monospace; font-size: 12px; fill: #38bdf8; letter-spacing: 1px; }
    .foot { font-family: 'Courier New', monospace; font-size: 13px; fill: #94a3b8; font-style: italic; }
    .caption { font-family: 'Courier New', monospace; font-size: 12px; fill: #475569; letter-spacing: 3px; }
    .term { font-family: 'Courier New', monospace; font-size: 12px; fill: #64748b; }
  </style>
</defs>

