<svg xmlns="http://www.w3.org/2000/svg" width="1125" height="536" viewBox="0 0 1125 536" role="img" aria-label="ASCII GitHub profile card for Haykal">
  <defs>
    <filter id="neonGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="1.4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="scanGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#39d6ff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#39d6ff" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#39d6ff" stop-opacity="0"/>
    </linearGradient>
    <pattern id="gridPattern" width="26" height="26" patternUnits="userSpaceOnUse">
      <path d="M 26 0 L 0 0 0 26" fill="none" stroke="#1f6feb" stroke-width="0.5" opacity="0.16"/>
    </pattern>
  </defs>

  <!-- base card -->
  <rect x="0.5" y="0.5" width="1124" height="535" rx="8" fill="#0d1117" stroke="#30363d"/>
  <rect x="8" y="8" width="1109" height="520" fill="url(#gridPattern)"/>

  <!-- pulsing neon border -->
  <rect x="0.5" y="0.5" width="1124" height="535" rx="8" fill="none" stroke="#39d6ff" stroke-width="1.4" opacity="0.2">
    <animate attributeName="opacity" values="0.12;0.5;0.12" dur="3s" repeatCount="indefinite"/>
  </rect>

  <!-- corner HUD brackets -->
  <g stroke="#39d6ff" stroke-width="2" fill="none" opacity="0.65">
    <path d="M14,34 L14,14 L34,14"/>
    <path d="M1091,14 L1111,14 L1111,34"/>
    <path d="M14,502 L14,522 L34,522"/>
    <path d="M1111,502 L1111,522 L1091,522"/>
  </g>

  <!-- system status chip -->
  <circle cx="1085" cy="37" r="4" fill="#3fb950">
    <animate attributeName="opacity" values="1;0.25;1" dur="1.6s" repeatCount="indefinite"/>
  </circle>
  <text x="1097" y="41" text-anchor="end" font-family="'Consolas','Menlo','DejaVu Sans Mono',monospace" font-size="11" letter-spacing="1" fill="#3fb950">SYSTEM ACTIVE</text>

